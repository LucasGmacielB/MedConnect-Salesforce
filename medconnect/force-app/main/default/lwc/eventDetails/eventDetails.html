<template>
  <lightning-card title="Medical Event Details">
    <div slot="actions" class="actions">
      <lightning-button label="New Speaker" onclick={handleNewSpeaker}>
      </lightning-button>

      <lightning-button label="New Attendee" onclick={handleNewAttendee}>
      </lightning-button>
    </div>

    <template if:true={loading}>
      <lightning-spinner alternative-text="Loading"> </lightning-spinner>
    </template>

    <template if:false={loading}>
      <lightning-tabset>
        <!-- EVENT DETAILS -->

        <lightning-tab label="Event Details">
          <lightning-record-form
            record-id={recordId}
            object-api-name="Medical_Event__c"
            layout-type="Full"
            mode="readonly"
          >
          </lightning-record-form>
        </lightning-tab>

        <!-- SPEAKERS -->

        <lightning-tab label="Speakers">
          <lightning-datatable
            key-field="Id"
            data={speakers}
            columns={speakerColumns}
          >
          </lightning-datatable>
        </lightning-tab>

        <!-- LOCATION -->

        <lightning-tab label="Location Details">
            <template if:true={location}>

                <div class="slds-p-around_medium slds-box slds-theme_default">

                    <div class="slds-grid slds-wrap slds-gutters">

                        <div class="slds-col slds-size_1-of-2">
                            <strong>Street: </strong>
                            <lightning-formatted-text
                                value={location.Street__c}>
                            </lightning-formatted-text>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <strong>City: </strong>
                            <lightning-formatted-text
                                value={location.City__c}>
                            </lightning-formatted-text>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <strong>State: </strong>
                            <lightning-formatted-text
                                value={location.State__c}>
                            </lightning-formatted-text>
                        </div>

                        <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                            <strong>Postal Code: </strong>
                            <lightning-formatted-text
                                value={location.Postal_Code__c}>
                            </lightning-formatted-text>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                            <strong>Country: </strong>
                            <lightning-formatted-text
                                value={location.Country__c}>
                            </lightning-formatted-text>
                        </div>

                    </div>

                </div>

            </template>
        </lightning-tab>

        <!-- ATTENDEES -->

        <lightning-tab label="Attendees">
          <lightning-datatable
            key-field="Id"
            data={attendees}
            columns={attendeeColumns}
          >
          </lightning-datatable>
        </lightning-tab>
      </lightning-tabset>
    </template>
  </lightning-card>
</template>
