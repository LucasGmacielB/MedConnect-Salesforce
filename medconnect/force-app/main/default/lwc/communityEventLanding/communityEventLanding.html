<template>
  <main class="page">
    <header class="site-header">
      <div class="brand">Med<span>Connect</span></div>
      <div class="tagline">Healthcare Events and Conferences</div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1>Central de <span>Informações</span> Científicas</h1>
        <p class="subtitle">
          Consulte o cronograma atualizado de congressos, simpósios e painéis
          médicos do setor de saúde.
        </p>
      </div>
    </section>

    <section class="events-section" aria-labelledby="upcoming-events-title">
      <div class="section-heading">
        <div class="section-border"></div>
        <div>
          <h2 id="upcoming-events-title">Próximos Eventos Programados</h2>
          <p>Dados atualizados para o calendário vigente</p>
        </div>
      </div>

      <template if:true={loading}>
        <lightning-spinner
          alternative-text="Carregando eventos"
          size="medium"
        ></lightning-spinner>
      </template>

      <template if:false={loading}>
        <template if:true={hasEvents}>
          <div class="event-grid">
            <template for:each={events} for:item="event">
              <article key={event.eventId} class="event-card">
                <span class="event-type">{event.eventType}</span>

                <h3>{event.eventName}</h3>

                <p class="event-date">🗓️ {event.periodLabel}</p>
                <p class="event-location">📍 {event.locationLabel}</p>

                <div class="divider"></div>

                <p class="event-description">{event.description}</p>

                <button
                  class="card-action"
                  type="button"
                  data-id={event.eventId}
                  onclick={handleCardClick}
                >
                  Ver detalhes
                </button>
              </article>
            </template>
          </div>
        </template>

        <template if:false={hasEvents}>
          <div class="empty-state">
            Nenhum evento programado foi encontrado no momento.
          </div>
        </template>
      </template>
    </section>

    <footer class="site-footer">
      <div>
        <h2>Med<span>Connect</span></h2>
        <p>
          Sua plataforma central de atualização científica, conectando
          profissionais de saúde aos maiores eventos e congressos médicos do país.
        </p>
      </div>

      <nav aria-label="Navegação">
        <h3>Navegação</h3>
        <a href="/">• Início</a>
        <a href="/events">• Calendário de Eventos</a>
        <a href="/support">• Suporte</a>
      </nav>

      <div>
        <h3>Contato &amp; Ajuda</h3>
        <p>• Central de Ajuda</p>
        <p>• Fale Conosco</p>
        <p>• Termos de Uso</p>
      </div>
    </footer>
  </main>
</template>
