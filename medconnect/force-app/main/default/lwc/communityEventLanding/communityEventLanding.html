<template>
  <main class="page">
    <header class="site-header">
      <div class="brand">MedConnect</div>
      <div class="tagline">Healthcare Events and Conferences</div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">Agenda publica MedConnect</p>
        <h1>Central de Informacoes Cientificas</h1>
        <p class="subtitle">
          Consulte o cronograma atualizado de congressos, simposios e paineis
          medicos do setor de saude.
        </p>
      </div>
    </section>

    <section class="events-section" aria-labelledby="upcoming-events-title">
      <div class="section-heading">
        <p class="section-kicker">Calendario</p>
        <h2 id="upcoming-events-title">Proximos Eventos Programados</h2>
      </div>

      <template if:true={loading}>
        <lightning-spinner
          alternative-text="Carregando eventos"
          size="medium"
        ></lightning-spinner>
      </template>

      <template if:false={loading}>
        <template if:true={hasEvents}>
          <div class="event-grid">
            <template for:each={events} for:item="event">
              <article key={event.eventId} class="event-card">
                <div class="card-topline">
                  <span class="event-type">{event.eventType}</span>
                  <span class="event-status">{event.status}</span>
                </div>

                <h3>{event.eventName}</h3>
                <p class="event-date">{event.periodLabel}</p>
                <p class="event-location">{event.locationLabel}</p>
                <p class="event-description">{event.description}</p>

                <button
                  class="card-action"
                  type="button"
                  data-id={event.eventId}
                  onclick={handleCardClick}
                >
                  Ver detalhes
                </button>
              </article>
            </template>
          </div>
        </template>

        <template if:false={hasEvents}>
          <div class="empty-state">
            Nenhum evento programado foi encontrado no momento.
          </div>
        </template>
      </template>
    </section>

    <footer class="site-footer">
      <div>
        <h2>MedConnect</h2>
        <p>Eventos cientificos para profissionais e organizacoes de saude.</p>
      </div>
      <nav aria-label="Navegacao">
        <h3>Navegacao</h3>
        <a href="/">Inicio</a>
        <a href="/events">Eventos</a>
        <a href="/support">Suporte</a>
      </nav>
      <div>
        <h3>Contato &amp; Ajuda</h3>
        <p>events@medconnect.example</p>
        <p>Atendimento para participantes e organizadores.</p>
      </div>
    </footer>
  </main>
</template>
